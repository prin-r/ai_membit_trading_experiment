[project]
name = "ai-api-client"
version = "0.1.0"
description = "AI API client for Cerebras with optional Membit integration"
requires-python = ">=3.10"
dependencies = [
    "cerebras-cloud-sdk",
    "requests>=2.31.0",
    "membit-python",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
